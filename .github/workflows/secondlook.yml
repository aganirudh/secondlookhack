name: Second Look advisory

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: [connection-budget.json]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secondlook-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Review the proposed connection budget
        env:
          GH_TOKEN: ${{ github.token }}
          HINDSIGHT_URL: ${{ vars.HINDSIGHT_URL }}
          HINDSIGHT_BANK: ${{ vars.HINDSIGHT_BANK }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          SECONDLOOK_MEMORY: ${{ vars.SECONDLOOK_MEMORY || 'on' }}
        run: python3 review.py --memory "$SECONDLOOK_MEMORY" github
